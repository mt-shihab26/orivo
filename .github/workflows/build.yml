name: Build

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege by default: only the jobs that upload release assets or
# push commits opt into write access below.
permissions:
  contents: read

jobs:
  build-binaries:
    name: Build linux-${{ matrix.arch_tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch_tag: x86_64
          # raylib is compiled by cgo, so each arch builds on its own runner
          # instead of cross-compiling.
          - os: ubuntu-24.04-arm
            arch_tag: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # raylib is compiled from source by cgo and needs the windowing headers.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Build
        shell: bash
        run: |
          BINARY_ASSET="orivo-${GITHUB_REF_NAME}-linux-${{ matrix.arch_tag }}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "$BINARY_ASSET" .
          echo "BINARY_ASSET=$BINARY_ASSET" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: orivo-linux-${{ matrix.arch_tag }}
          path: ${{ env.BINARY_ASSET }}

  update-release:
    name: Update GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release assets
        run: |
          cp pkg/orivo-omarchy.desktop dist/orivo-omarchy.desktop
          cp pkg/orivo.svg dist/orivo.svg

      - name: Generate checksums
        run: |
          cd dist
          sha256sum orivo-v* orivo-omarchy.desktop orivo.svg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/orivo-v* \
            dist/SHA256SUMS.txt \
            dist/orivo-omarchy.desktop \
            dist/orivo.svg \
            --clobber

  update-aur-package:
    name: Update AUR Package (PKGBUILD)
    needs: update-release
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install build tools
        run: |
          pacman -Sy --noconfirm --needed base-devel pacman-contrib git sudo
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Update PKGBUILD checksums and .SRCINFO
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"

          # updpkgsums only recomputes checksums for whatever pkgver is already in PKGBUILD —
          # it doesn't know about the tag that triggered this workflow, so pkgver has to be
          # bumped to match first or it'd happily hash a stale, already-released version.
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$GITHUB_WORKSPACE/pkg/PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$GITHUB_WORKSPACE/pkg/PKGBUILD"

          sudo -u builder bash -c "cd '$GITHUB_WORKSPACE/pkg' && updpkgsums && makepkg --printsrcinfo > .SRCINFO"

      - name: Commit and push
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkg/PKGBUILD pkg/.SRCINFO
          if ! git diff --cached --quiet; then
            git commit --author="$ACTOR <$ACTOR_ID+$ACTOR@users.noreply.github.com>" -m "chore: bump PKGBUILD to ${GITHUB_REF_NAME} and update checksums"
            git push origin HEAD:main
          fi
